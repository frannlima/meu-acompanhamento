name: Deploy Meu Acompanhamento

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Cockpit scripts and image sharing
        run: |
          node --check cockpit-vendas-v1.js
          node --check cockpit-share-v1.js
          node --check sales-curve-tech-v1.js
          node --check group-impact-interactive-v1.js
          node --check ma3-group-live-v1.js
          node --check ma3-faithful-v1.js
          node --test tests/ma3-group-live.test.cjs
          node --check clarity-v1.js
          node --test tests/group-impact-interactive.test.cjs
          node --test tests/sales-curve-tech.test.cjs
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          cockpit = Path("cockpit-vendas-v1.js").read_text(encoding="utf-8")
          sharing = Path("cockpit-share-v1.js").read_text(encoding="utf-8")
          css = Path("cockpit-vendas-v1.css").read_text(encoding="utf-8")
          checks = {
              "single share action": 'id="cockpitShareResult"' in html,
              "old buttons removed": all(x not in html for x in ('id="cockpitShareCard"', 'id="cockpitDownloadCard"', 'id="cockpitShare"')),
              "image script": "cockpit-share-v1.js" in html,
              "peak real sales calculation": "function peakComparison(" in cockpit,
              "peak proportional target": "peak.w*minutes/60" in cockpit,
              "red below-expected state": ".cp-peak-below" in css,
              "green above-expected state": ".cp-peak-above" in css,
              "horizontal canvas card": "async function buildCard(d)" in sharing and "canvas.width=1600;canvas.height=900" in sharing,
              "share text with PNG": "text:summary,files:[file]" in sharing,
              "offline generator": "document.createElement(\"canvas\")" in sharing,
              "fallback copies summary": "copy(summary)" in sharing,
              "same cockpit source": "getShareText:" in cockpit and "getShareData:" in cockpit,
              "curve tech JS and CSS": "sales-curve-tech-v1.js" in html and "sales-curve-tech-v1.css" in html,
              "groups interactive mobile": "group-impact-interactive-v1.js" in html and "group-impact-interactive-v1.css" in html,
              "live card replaces preview": "ma3-group-live-v1.js" in html and "ma3-group-live-v1.css" in html,
          }
          for name, ok in checks.items():
              if not ok:
                  raise SystemExit("Cockpit regression: " + name)
              print("PASS:", name)
          PY
      - name: Version assets and PWA for every deployment
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          build = os.environ["GITHUB_SHA"][:12] + "-" + os.environ["GITHUB_RUN_NUMBER"]
          html_path = Path("index.html")
          html = html_path.read_text(encoding="utf-8")
          asset_re = r'((?:src|href)=")(\./[^"?]+\.(?:js|css|webmanifest))(\?[^"]*)?(")'

          def stamp(match):
              query = match.group(3) or ""
              separator = "&" if query else "?"
              return match.group(1) + match.group(2) + query + separator + "build=" + build + match.group(4)

          html, count = re.subn(asset_re, stamp, html)
          if count < 20:
              raise SystemExit("Asset versioning failed: too few JS/CSS references")
          html_path.write_text(html, encoding="utf-8")

          sw_path = Path("service-worker.js")
          sw = sw_path.read_text(encoding="utf-8")
          if sw.count("__BUILD_ID__") != 1:
              raise SystemExit("Service worker version placeholder is missing or duplicated")
          sw_path.write_text(sw.replace("__BUILD_ID__", build), encoding="utf-8")
          print("Published PWA build:", build, "versioned assets:", count)
          PY
      - name: Validar e empacotar a extensão Flash 0.4.0
        run: |
          node --check flash-auth-session-v1.js
          node --check flash-pilot-v1.js
          node --check flash-details-v1.js
          node --check extension-flash/background.js
          node --check extension-flash/popup.js
          node --check extension-flash/transfer.js
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          root = Path("extension-flash")
          manifest = json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          if manifest["version"] != "0.4.0":
              raise SystemExit("Versão da extensão divergente")
          required = ["manifest.json","background.js","popup.js","popup.html","capture.js","transfer.js","flash-core-v1.js","flash-detail-core-v1.js"]
          for filename in required:
              if not (root/filename).is_file():
                  raise SystemExit("Extensão incompleta: " + filename)
          filename = Path("extension-flash-v0.4.0.zip")
          with zipfile.ZipFile(filename, "w", zipfile.ZIP_DEFLATED) as z:
              for file in sorted(root.iterdir()):
                  if file.is_file():
                      z.write(file, arcname="extension-flash/" + file.name)
          with zipfile.ZipFile(filename) as z:
              for item in required:
                  if "extension-flash/" + item not in z.namelist():
                      raise SystemExit("ZIP não inclui: " + item)
          print("Extensão pronta:", filename, filename.stat().st_size, "bytes")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published PWA release
        id: production_validation
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          base = "https://frannlima.github.io/meu-acompanhamento/"
          build = os.environ["EXPECTED_SHA"][:12] + "-" + os.environ["RUN_NUMBER"]
          headers = {"Cache-Control": "no-cache", "User-Agent": "MeuAcompanhamento-DeploySmoke/1.0"}

          def read(url):
              with urlopen(Request(url, headers=headers), timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}: {url}")
                  return response.read().decode("utf-8", errors="replace")

          for attempt in range(1, 19):
              try:
                  html = read(base)
                  sw = read(base + "service-worker.js")
                  if ("build=" + build) not in html or ("meu-acompanhamento-" + build) not in sw:
                      raise RuntimeError("GitHub Pages ainda entrega um release anterior")
                  if 'name="viewport"' not in html or "mobile-experience-v1.css" not in html:
                      raise RuntimeError("HTML responsivo ausente do deploy")
                  if 'id="maStartup"' not in html or 'classList.add("ma-booting")' not in html:
                      raise RuntimeError("Protecao contra a interface antiga nao foi publicada")
                  if html.count('class="dock-label"') < 7 or '>Cockpit</span>' not in html or '>Radar</span>' not in html:
                      raise RuntimeError("Menu mobile inicial nao corresponde a versao 3.0")
                  js = read(base + "app.js")
                  if 'updateViaCache:"none"' not in js:
                      raise RuntimeError("O script principal do PWA nao foi atualizado")
                  if 'document.documentElement.classList.add("ma-booting")' not in js or 'window.renderMA3()' not in js:
                      raise RuntimeError("Sincronizacao da interface na abertura nao publicada")
                  for asset in ("styles.css", "responsive-device-v1.css", "cockpit-vendas-v1.js", "cockpit-vendas-v1.css", "cockpit-share-v1.js", "sales-curve-tech-v1.js", "sales-curve-tech-v1.css", "ma3-group-live-v1.js", "ma3-group-live-v1.css"):
                      url = next((x for x in re.findall(r'(?:src|href)="(\./[^"]+)"', html) if x.startswith("./" + asset + "?")), None)
                      if not url or ("build=" + build) not in url:
                          raise RuntimeError("Asset nao versionado: " + asset)
                      read(base + url.removeprefix("./"))
                  if 'id="cockpitShareResult"' not in html or 'id="cockpitShareCard"' in html or 'id="cockpitDownloadCard"' in html:
                      raise RuntimeError("Botao unico Compartilhar resultado ausente ou controles antigos presentes")
                  if "function peakComparison(" not in read(base + "cockpit-vendas-v1.js"):
                      raise RuntimeError("Comparativo real dos horarios de pico nao publicado")
                  share_js = read(base + "cockpit-share-v1.js")
                  if "async function buildCard(d)" not in share_js or "canvas.width=1600;canvas.height=900" not in share_js or "text:summary,files:[file]" not in share_js:
                      raise RuntimeError("Card horizontal 16:9 e legenda nao publicados")
                  cockpit_js = read(base + "cockpit-vendas-v1.js")
                  if "getShareText:" not in cockpit_js or "getShareData:" not in cockpit_js:
                      raise RuntimeError("Resumo do cockpit nao unificado")
                  print("Release verificado no GitHub Pages:", build)
                  print("HTML, service worker, app.js, CSS responsivo e cockpit disponiveis.")
                  break
              except (URLError, TimeoutError, RuntimeError) as exc:
                  if attempt == 18:
                      raise SystemExit(f"Validacao do Pages nao concluida: {exc}")
                  print(f"Tentativa {attempt}/18: {exc}")
                  time.sleep(10)
          PY

      - name: Report production verification to GitHub
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATE: ${{ steps.deployment.outcome }}
          VERIFY_STATE: ${{ steps.production_validation.outcome }}
        run: |
          if [ "$DEPLOY_STATE" = "success" ] && [ "$VERIFY_STATE" = "success" ]; then
            result="success"
            description="Pages publicado; PWA, Cockpit e compartilhamento verificados."
          else
            result="failure"
            description="Publicacao ou verificacao do app falhou; consultar Actions."
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$result" \
            -f context="Meu Acompanhamento / Pages" \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions"
