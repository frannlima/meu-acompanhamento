name: Deploy Meu Acompanhamento

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Cockpit scripts and image sharing
        run: |
          node --check cockpit-vendas-v1.js
          node --check cockpit-share-v1.js
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          cockpit = Path("cockpit-vendas-v1.js").read_text(encoding="utf-8")
          sharing = Path("cockpit-share-v1.js").read_text(encoding="utf-8")
          css = Path("cockpit-vendas-v1.css").read_text(encoding="utf-8")
          checks = {
              "share action": 'id="cockpitShareCard"' in html,
              "download action": 'id="cockpitDownloadCard"' in html,
              "image script": "cockpit-share-v1.js" in html,
              "peak real sales calculation": "function peakComparison(" in cockpit,
              "peak proportional target": "peak.w*minutes/60" in cockpit,
              "red below-expected state": ".cp-peak-below" in css,
              "green above-expected state": ".cp-peak-above" in css,
              "image native fallback": "function backup(root)" in sharing,
          }
          for name, ok in checks.items():
              if not ok:
                  raise SystemExit("Cockpit regression: " + name)
              print("PASS:", name)
          PY
      - name: Version assets and PWA for every deployment
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          build = os.environ["GITHUB_SHA"][:12] + "-" + os.environ["GITHUB_RUN_NUMBER"]
          html_path = Path("index.html")
          html = html_path.read_text(encoding="utf-8")
          asset_re = r'((?:src|href)=")(\./[^"?]+\.(?:js|css|webmanifest))(\?[^"]*)?(")'

          def stamp(match):
              query = match.group(3) or ""
              separator = "&" if query else "?"
              return match.group(1) + match.group(2) + query + separator + "build=" + build + match.group(4)

          html, count = re.subn(asset_re, stamp, html)
          if count < 20:
              raise SystemExit("Asset versioning failed: too few JS/CSS references")
          html_path.write_text(html, encoding="utf-8")

          sw_path = Path("service-worker.js")
          sw = sw_path.read_text(encoding="utf-8")
          if sw.count("__BUILD_ID__") != 1:
              raise SystemExit("Service worker version placeholder is missing or duplicated")
          sw_path.write_text(sw.replace("__BUILD_ID__", build), encoding="utf-8")
          print("Published PWA build:", build, "versioned assets:", count)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published PWA release
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          base = "https://frannlima.github.io/meu-acompanhamento/"
          build = os.environ["EXPECTED_SHA"][:12] + "-" + os.environ["RUN_NUMBER"]
          headers = {"Cache-Control": "no-cache", "User-Agent": "MeuAcompanhamento-DeploySmoke/1.0"}

          def read(url):
              with urlopen(Request(url, headers=headers), timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}: {url}")
                  return response.read().decode("utf-8", errors="replace")

          for attempt in range(1, 19):
              try:
                  html = read(base)
                  sw = read(base + "service-worker.js")
                  if ("build=" + build) not in html or ("meu-acompanhamento-" + build) not in sw:
                      raise RuntimeError("GitHub Pages ainda entrega um release anterior")
                  if 'name="viewport"' not in html or "mobile-experience-v1.css" not in html:
                      raise RuntimeError("HTML responsivo ausente do deploy")
                  if 'id="maStartup"' not in html or 'classList.add("ma-booting")' not in html:
                      raise RuntimeError("Protecao contra a interface antiga nao foi publicada")
                  if html.count('class="dock-label"') < 7 or '>Cockpit</span>' not in html or '>Radar</span>' not in html:
                      raise RuntimeError("Menu mobile inicial nao corresponde a versao 3.0")
                  js = read(base + "app.js")
                  if 'updateViaCache:"none"' not in js:
                      raise RuntimeError("O script principal do PWA nao foi atualizado")
                  if 'document.documentElement.classList.add("ma-booting")' not in js or 'window.renderMA3()' not in js:
                      raise RuntimeError("Sincronizacao da interface na abertura nao publicada")
                  for asset in ("styles.css", "responsive-device-v1.css", "cockpit-vendas-v1.js", "cockpit-vendas-v1.css", "cockpit-share-v1.js"):
                      url = next((x for x in re.findall(r'(?:src|href)="(\./[^"]+)"', html) if x.startswith("./" + asset + "?")), None)
                      if not url or ("build=" + build) not in url:
                          raise RuntimeError("Asset nao versionado: " + asset)
                      read(base + url.removeprefix("./"))
                  if 'id="cockpitShareCard"' not in html or 'id="cockpitDownloadCard"' not in html:
                      raise RuntimeError("Botoes de compartilhar e baixar imagem ausentes")
                  if "function peakComparison(" not in read(base + "cockpit-vendas-v1.js"):
                      raise RuntimeError("Comparativo real dos horarios de pico nao publicado")
                  if "function backup(root)" not in read(base + "cockpit-share-v1.js"):
                      raise RuntimeError("Captura de imagem do cockpit nao publicada")
                  print("Release verificado no GitHub Pages:", build)
                  print("HTML, service worker, app.js, CSS responsivo e cockpit disponiveis.")
                  break
              except (URLError, TimeoutError, RuntimeError) as exc:
                  if attempt == 18:
                      raise SystemExit(f"Validacao do Pages nao concluida: {exc}")
                  print(f"Tentativa {attempt}/18: {exc}")
                  time.sleep(10)
          PY
