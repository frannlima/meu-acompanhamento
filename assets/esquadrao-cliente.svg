<text x="380" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#173F35">do Cliente</text>
<g font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#fff" text-anchor="middle">
<text x="505" y="205"><tspan x="505" dy="0">Loja limpa,</tspan><tspan x="505" dy="22">arrumada</tspan><tspan x="505" dy="22">e iluminada</tspan></text>
<text x="555" y="365"><tspan x="555" dy="0">Foco no produto</tspan><tspan x="555" dy="22">com uma exposição</tspan><tspan x="555" dy="22">vendedora</tspan></text>
<text x="375" y="525"><tspan x="375" dy="0">Olhar no olho, sorrir,</tspan><tspan x="375" dy="22">cumprimentar e</tspan><tspan x="375" dy="22">estar disponível</tspan></text>
<text x="195" y="395"><tspan x="195" dy="0">Caixa com o</tspan><tspan x="195" dy="22">mínimo de filas</tspan><tspan x="195" dy="22">e atritos</tspan></text>
<text x="255" y="225"><tspan x="255" dy="0">Nosso time é a</tspan><tspan x="255" dy="22">nossa fortaleza</tspan></text>
</g>
