<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" role="img" aria-labelledby="t d">
<title id="t">Avatar RIA agitando bandeira verde</title><desc id="d">Colaboradora sorridente com blusa branca e bandeira RIA em movimento.</desc>
<defs>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e1618"/><stop offset=".6" stop-color="#3c2625"/><stop offset="1" stop-color="#130f13"/></linearGradient>
<linearGradient id="skin" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffd1aa"/><stop offset=".5" stop-color="#e6a679"/><stop offset="1" stop-color="#cb835d"/></linearGradient>
<linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".65" stop-color="#eeeae4"/><stop offset="1" stop-color="#d1d4d0"/></linearGradient>
<linearGradient id="flag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#286a51"/><stop offset=".55" stop-color="#123e34"/><stop offset="1" stop-color="#0a332d"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102d27" flood-opacity=".20"/></filter>
</defs>
<style>
#aria-flag{transform-box:view-box;transform-origin:244px 55px;animation:ria-wave 1.7s ease-in-out infinite}
#aria-flag .cloth-ripple{animation:ria-ripple 1.7s ease-in-out infinite;transform-origin:246px 58px;transform-box:view-box}
#aria-body{animation:ria-bob 2.9s ease-in-out infinite}
@keyframes ria-wave{0%,100%{transform:rotate(-4deg) skewY(1deg)}50%{transform:rotate(6deg) skewY(-3deg)}}
@keyframes ria-ripple{0%,100%{transform:scaleX(.98)}50%{transform:scaleX(1.05)}}
@keyframes ria-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@media(prefers-reduced-motion:reduce){#aria-flag,#aria-flag .cloth-ripple,#aria-body{animation:none}}
</style>
<g filter="url(#shadow)" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
<!-- cabelo, torso e braço do avatar adesivo -->
<path d="M116 224c-18-67 1-131 75-141 71-11 111 34 99 119-6 47 18 91 11 131H94c-2-34 21-75 22-109z" fill="url(#hair)"/>
