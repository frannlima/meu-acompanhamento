<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativação ADM • Meu Acompanhamento</title><style>body{font:16px system-ui;background:#f5f7f4;color:#173f35;margin:0;padding:24px}.panel{max-width:460px;margin:8vh auto;background:white;border:1px solid #dbe5dc;border-radius:18px;padding:26px;box-shadow:0 10px 32px #173f3512}h1{font-size:24px}label{display:block;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #9fb5a7;border-radius:9px;font:inherit}button{background:#173f35;color:white;border:0;border-radius:9px;padding:14px 18px;font:inherit;margin-top:16px;cursor:pointer}p{line-height:1.5}small{color:#52675c}</style></head><body><main class="panel"><h1>Ativar acesso administrativo</h1><p>Gerenciamento de avatares dos gerentes por filial.</p><label for="email">E-mail autorizado</label><input id="email" type="email" autocomplete="email" value="Franlimabreu@hotmail.com"><button id="send">Enviar link de acesso</button><button id="logout" hidden>Sair</button><p id="status" role="status">O acesso será ativado somente após confirmar o e-mail.</p><small>O login por matrícula das lojas permanece inalterado.</small></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.min.js"></script><script>
const sb=window.supabase.createClient("https://vvgejviwvtnlahbyopah.supabase.co","sb_publishable_XBa55FcPfePH_roJs2ejHg_KK9lV0R6",{auth:{storageKey:"ma-avatar-admin-auth",persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});
const status=document.getElementById("status"),send=document.getElementById("send"),logout=document.getElementById("logout");
async function check(){const {data:{session}}=await sb.auth.getSession();if(!session){logout.hidden=true;send.hidden=false;return}logout.hidden=false;send.hidden=true;const {data,error}=await sb.from("manager_avatar_admins").select("user_id").eq("user_id",session.user.id).maybeSingle();status.textContent=error?"Falha ao verificar autorização: "+error.message:data?"E-mail confirmado e permissão ADM ativada.":"E-mail confirmado, mas ainda sem autorização administrativa.";}
send.onclick=async()=>{const email=document.getElementById("email").value.trim();if(!email){status.textContent="Informe seu e-mail.";return}send.disabled=true;status.textContent="Solicitando link de confirmação...";try{const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});status.textContent=error?"Não foi possível enviar: "+error.message:"Confira a caixa de entrada e o spam. Abra o link recebido neste navegador.";}finally{send.disabled=false}};
logout.onclick=async()=>{await sb.auth.signOut();status.textContent="Sessão encerrada.";await check()};
sb.auth.onAuthStateChange(()=>setTimeout(check,0));check();
</script></body></html>
